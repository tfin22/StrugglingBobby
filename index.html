<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bobby Strugglin'</title>
<link rel="manifest" href="manifest.webmanifest" id="manifest-link">
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; font-family: monospace; color: #fc0; }
  #game { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
  #bloom { position: absolute; pointer-events: none; filter: blur(3px) brightness(1.3); mix-blend-mode: screen; opacity: 0.35; display: none; image-rendering: auto; }
  #crt { position: absolute; pointer-events: none; display: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 50%, rgba(0,0,0,0.32) 50%, rgba(0,0,0,0.32) 100%),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.45) 100%); }
  #touch { position: absolute; inset: 0; }
  .btn { position: absolute; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(255,204,0,0.55);
    background: rgba(20,20,20,0.35); color: rgba(255,220,80,0.85); font: bold 13px monospace; display: flex;
    align-items: center; justify-content: center; text-align: center; line-height: 1.05; pointer-events: none; white-space: pre; }
  .btn.on { background: rgba(255,204,0,0.45); color: #000; }
  .dpad { border-radius: 10px; }
  .hide { display: none !important; }
</style>
</head>
<body>
<canvas id="game" width="320" height="200"></canvas>
<canvas id="bloom" width="160" height="100"></canvas>
<div id="crt"></div>
<div id="touch"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
